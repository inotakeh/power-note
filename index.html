<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パワーノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090d18" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>ぼくのパワーノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});</script>
<style>
/* Layout: one phone column. Hero card on top (pixel hero, level), panels below, tab bar fixed to the bottom. Same family as the big brother's soccer note, with a green hero colour. */
:root{
  --bg:#eceff6; --paper:#ffffff; --ink:#141a2e; --muted:#5a6480; --rule:#d3d9e8;
  --accent:#ffc928; --accent-ink:#3a2c00; --kick:#e8501f; --on:#ffffff;
  --good:#12915a; --soft:#e0f3ea; --chip:#f2f5fc;
  --brain:#6c44c8; --leg:#2f6fe4; --arm:#e8501f; --body:#12915a; --heart:#d93a74;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body-font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090d18; --paper:#121a2e; --ink:#e8ecf8; --muted:#98a3bf; --rule:#27314f;
  --accent:#ffd34f; --accent-ink:#2a2000; --kick:#ff875f; --on:#160b05;
  --good:#4fd39a; --soft:#11302a; --chip:#161f38;
  --brain:#b99bff; --leg:#73a2ff; --arm:#ff875f; --body:#4fd39a; --heart:#ff7aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d18; --paper:#121a2e; --ink:#e8ecf8; --muted:#98a3bf; --rule:#27314f;
  --accent:#ffd34f; --accent-ink:#2a2000; --kick:#ff875f; --on:#160b05;
  --good:#4fd39a; --soft:#11302a; --chip:#161f38;
  --brain:#b99bff; --leg:#73a2ff; --arm:#ff875f; --body:#4fd39a; --heart:#ff7aa8; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{font-family:var(--body-font);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.2rem} h3{font-size:1rem} p{margin:0}
.panel{background:var(--paper);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--rule)}
.muted{color:var(--muted);font-size:.88rem}
.label{font-size:.78rem;letter-spacing:.08em;font-weight:800}
#view{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}

/* hero card */
.card{--team:#19c37d;position:relative;border-radius:10px 26px 10px 26px;overflow:hidden;background:linear-gradient(135deg,#070b18 0%,#12302a 55%,#070b18 100%);color:#fff;padding:12px 16px 12px 6px;display:grid;grid-template-columns:minmax(0,40%) 1fr;gap:8px;align-items:center;border:1px solid #1f6b4c}
.card::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 0 58%,rgba(25,195,125,.7) 58% 59.5%,transparent 59.5% 64%,rgba(25,195,125,.35) 64% 64.8%,transparent 64.8%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 16px);pointer-events:none}
.card>*{position:relative}
.fig svg{width:100%;height:auto;display:block}
.who{display:flex;flex-direction:column;gap:6px;min-width:0}
.tags{padding-right:70px}
.rank{display:inline-flex;font-weight:800;font-size:.8rem;padding:2px 12px;border-radius:3px;transform:skewX(-10deg);background:#ffd34f;color:#2a2000}
.pname{font-family:var(--display);font-size:1.4rem;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.lv{font-family:var(--display);font-size:2.4rem;line-height:1;text-shadow:0 0 14px var(--team)}
.lv small{font-size:1rem;margin-right:4px}
.xpbar{height:12px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;transform:skewX(-10deg)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--team),#ffd34f);transition:width .8s ease}
.xptext{font-size:.8rem;color:#c9d3ea}
.xptext b{color:#ffd34f}
.gear{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:4px 10px;font-size:.8rem}

/* buttons */
.primary{border:0;background:var(--kick);color:var(--on);font-family:var(--display);font-size:1.2rem;border-radius:16px;padding:16px;letter-spacing:.05em;width:100%}
.primary:disabled{opacity:.4}
.ghost{border:2px solid var(--rule);background:transparent;border-radius:12px;padding:10px 14px;font-weight:700}
.ticket{background:var(--paper);border:2px solid var(--kick);border-radius:18px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ticket b{font-family:var(--display);font-size:1.4rem;margin-left:8px;color:var(--kick)}

/* stats */
.stat{display:grid;grid-template-columns:2.2rem 1fr auto;gap:4px 10px;align-items:center}
.stat .ico{font-size:1.5rem;text-align:center;line-height:1}
.stat .nm{font-weight:800}
.stat .v{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:12px;background:var(--chip);border-radius:999px;overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;border-radius:999px;transition:width .8s ease}
.total{font-family:var(--display);font-size:1.6rem;color:var(--good)}
.unl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.unl li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:10px;background:var(--chip);font-weight:700}
.unl li.got{background:var(--soft);color:var(--good)}

/* record chips */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:2px solid var(--rule);background:var(--chip);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:118px;justify-content:center;position:relative;min-width:0}
.act .e{font-size:2.1rem;line-height:1.15;font-family:var(--display)}
.act .t{font-weight:800;font-size:.92rem;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.act .sub{font-size:.68rem;color:var(--muted);line-height:1.3}
.act .up{font-size:.72rem;font-weight:800;color:var(--muted)}
.act[aria-pressed="true"]{border-color:var(--kick);background:var(--kick);color:var(--on)}
.act[aria-pressed="true"] .sub,.act[aria-pressed="true"] .up{color:var(--on)}
.act.done{border-color:var(--good);background:var(--soft);color:var(--good)}
.act.done .up{color:var(--good)}
.act.done::after{content:"できた!";position:absolute;top:6px;right:8px;font-size:.7rem;font-weight:800;background:var(--good);color:var(--paper);border-radius:999px;padding:0 8px}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:.75rem;font-weight:800;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);line-height:1.1}
.cal .d b{font-family:var(--display);font-size:1rem;color:var(--good)}
.cal .d.on{background:var(--soft)}
.cal .d.today{outline:2px solid var(--kick)}

/* battle */
.foe{display:flex;gap:12px;align-items:center}
.foe .em{font-size:3.4rem;line-height:1;width:84px;height:84px;border-radius:20px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.gears{display:flex;flex-direction:column;gap:8px}
.gi{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;border:2px solid var(--rule);background:var(--chip);border-radius:14px;padding:8px 12px;width:100%;min-height:60px}
.gi>svg,.gi>.gpx{width:44px;height:44px;display:block}
.gpx{object-fit:contain;image-rendering:pixelated}
.gi .t{font-weight:800;line-height:1.3}
.gi .up{font-size:.78rem;font-weight:800;color:var(--muted)}
.gi .tag{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--paper);border:1px solid var(--rule);white-space:nowrap}
.gi[aria-pressed="true"]{border-color:var(--good);background:var(--soft)}
.gi[aria-pressed="true"] .tag{background:var(--good);color:var(--paper);border-color:var(--good)}
.gi.shop .tag{background:var(--kick);color:var(--on);border-color:var(--kick)}
.gi.shop:disabled{opacity:1;border-style:dashed}
.gi.shop:disabled .tag{background:var(--paper);color:var(--muted);border-color:var(--rule)}
.coin{width:1.1em;height:1.1em;vertical-align:-.18em;display:inline-block}
.purse{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--accent);border-radius:18px;padding:10px 16px}
.purse b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.gi.lock{border-style:dashed;color:var(--muted)}
.gi.lock .q{font-family:var(--display);font-size:1.5rem;text-align:center}
.zukan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zukan>*{border:0;padding:0;aspect-ratio:1;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.9rem;color:var(--muted);font-family:var(--display)}
.zukan .got{background:var(--soft)}
.zukan button.got{cursor:pointer}.zukan .sel{outline:3px solid var(--accent)}
.pickg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:52vh;overflow:auto;padding:3px}
.pickg button{border:0;border-radius:14px;background:var(--soft);padding:6px 2px;font-size:1.7rem;display:flex;flex-direction:column;align-items:center;gap:2px}.pickg small{font-size:.68rem;color:var(--muted)}.pickg .nx{background:var(--accent);}.pickg .nx small{color:var(--accent-ink)}
.px0{image-rendering:pixelated;object-fit:contain}
.px{height:1.15em;width:auto;image-rendering:pixelated;vertical-align:-.2em;pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(6,10,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.sheet{background:var(--paper);border-radius:22px;padding:18px;width:100%;max-width:460px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.big{font-family:var(--display);font-size:1.5rem;line-height:1.3}
.lvup{font-family:var(--display);font-size:1.5rem;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:6px}
.hp{height:16px;border-radius:999px;background:var(--chip);border:1px solid var(--rule);overflow:hidden}
.hp i{display:block;height:100%;background:var(--kick);transition:width .6s ease}
.arena{min-height:250px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
.glyph{font-family:var(--display);font-size:5rem;line-height:1.1}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.choices button{font-family:var(--display);font-size:2.4rem;padding:14px 0;border-radius:16px;border:2px solid var(--rule);background:var(--chip)}
.choices.txt button{font-size:1.25rem;padding:18px 0}
.items{font-size:2rem;line-height:1.25;letter-spacing:.1em;max-width:280px}
.clock{width:150px;height:150px;color:var(--ink)}
.sum{font-family:var(--display);font-size:3rem;line-height:1.2}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.talk{border:2px solid var(--heart)}.talk .q{font-family:var(--display);font-size:1.15rem;line-height:1.5}
.coop{border:2px solid var(--leg)}.real{border:2px solid var(--brain)}
.steps{font-size:.8rem;font-weight:800;color:var(--muted)}
.moods button{border:2px solid var(--rule);background:var(--chip);border-radius:14px;padding:8px 0 4px;font-size:1.8rem;line-height:1.2;display:flex;flex-direction:column;align-items:center;min-width:0}
.moods button span{font-size:.62rem;font-weight:800;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:.72rem;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.week i{display:block;width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;background:var(--chip);border:2px solid var(--rule)}
.week .on i{background:var(--good);border-color:var(--good)}
.week .now i{border-color:var(--kick)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badges div{border-radius:14px;background:var(--chip);padding:8px 2px;text-align:center;font-size:1.7rem;line-height:1.2;color:var(--muted);font-family:var(--display);min-width:0}
.badges div span{display:block;font-family:var(--body-font);font-size:.72rem;font-weight:800;line-height:1.3;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.badges .got{background:var(--soft);color:var(--ink)}
.parent{text-align:left;font-size:.9rem;line-height:1.6}
.parent h3{font-family:var(--body-font);font-weight:800;font-size:.95rem;margin-top:6px}
.parent ul{margin:0;padding-left:1.2em}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px}
.hole{aspect-ratio:1;border-radius:18px;border:2px solid var(--rule);background:var(--chip);font-size:2.6rem;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.hole.hit{background:var(--good);border-color:var(--good)}
.hole.oops{background:var(--kick);border-color:var(--kick)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:280px}
.pad{aspect-ratio:1.25;border-radius:20px;border:4px solid transparent;opacity:.45;transition:opacity .1s,transform .1s}
.pad.lit{opacity:1;transform:scale(1.06);border-color:var(--ink)}
.pad:not(:disabled){opacity:.8}
.pad:not(:disabled):active{opacity:1;transform:scale(.96)}
.picks{display:flex;flex-direction:column;gap:8px}
.picks button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--rule);background:var(--chip);border-radius:14px;padding:8px 12px;font-weight:800;min-height:56px}
.picks button .e{font-size:1.8rem;line-height:1;font-family:var(--display);width:2.2rem;text-align:center;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--rule);background:var(--chip);border-radius:14px;padding:8px 0 6px;font-weight:800;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button .e{font-size:1.6rem}
.seg button[aria-pressed="true"]{border-color:var(--good);background:var(--soft);color:var(--good)}
.looks{display:flex;flex-direction:column;gap:10px;text-align:left}
.looks .lr{display:flex;flex-direction:column;gap:4px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--rule);padding:0}
.sw.tx{width:auto;border-radius:999px;padding:0 14px;background:var(--chip);font-weight:800;font-size:.9rem}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.act.mis{border-color:var(--accent)}
.act.mis::before{content:"ミッション";position:absolute;top:6px;left:8px;font-size:.66rem;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px}
.mission{border:2px solid var(--accent)}
.mission .m{display:flex;gap:12px;align-items:center}
.mission .m .e{font-size:2.2rem;line-height:1;font-family:var(--display)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamps button{font-size:2.4rem;padding:12px 0 6px;border-radius:16px;border:2px solid var(--rule);background:var(--chip);display:flex;flex-direction:column;align-items:center;gap:2px}
.stamps button span{font-size:.75rem;font-weight:800}
.stamped{display:flex;gap:12px;align-items:center;justify-content:center;font-weight:800}
.stamped .e{font-size:2.6rem;line-height:1}
.choices button.ok{background:var(--good);border-color:var(--good);color:var(--paper)}
.choices button.ng{background:var(--kick);border-color:var(--kick);color:var(--on)}
.tap{width:190px;height:190px;border-radius:50%;border:0;background:var(--kick);color:var(--on);font-family:var(--display);font-size:1.7rem;line-height:1.2;user-select:none;-webkit-user-select:none}
.tap:active{transform:scale(.95)}
.tap.wait{background:var(--muted)}
.tap.go{background:var(--good);color:var(--paper)}
.gauge{position:relative;width:100%;height:44px;border-radius:12px;background:linear-gradient(90deg,var(--chip) 0 30%,var(--accent) 30% 42%,var(--kick) 42% 58%,var(--accent) 58% 70%,var(--chip) 70%);border:2px solid var(--rule)}
.gauge i{position:absolute;top:-8px;bottom:-8px;width:8px;margin-left:-4px;border-radius:4px;background:var(--ink)}
.count{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.shake{animation:shake .4s}
.bhero{width:56px;flex:none}.bhero svg{display:block;width:100%;height:auto}
.lunge{animation:lunge .45s}
.au1{animation:au .5s steps(1) infinite}.au2{animation:au .5s steps(1) -.25s infinite}@keyframes au{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.au1{animation:none}.au2{display:none}}
@keyframes lunge{40%{transform:translateX(22px) scale(1.08)}}
.flash img,.flash{animation:flash .4s}
@keyframes flash{30%{filter:brightness(3)}}
.foe .em{position:relative}
.weak{margin:.5em 0;font-size:.95rem}.weakhit{color:#d12;font-weight:800}
.panel.boss{border:3px solid #d12}.panel.boss .em .px{height:1.5em}.em.shade .px{filter:brightness(0) opacity(.75)!important}
.pop{position:absolute;left:50%;top:0;transform:translateX(-50%);font-family:var(--display);font-size:1.7rem;color:#ff3b3b;-webkit-text-stroke:1px #fff;pointer-events:none;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;top:20px}20%{opacity:1}100%{opacity:0;top:-34px}}
.sndb{border:1px solid var(--rule);background:var(--chip);border-radius:999px;font-size:1.1rem;width:40px;height:40px;flex:none}
@media (prefers-reduced-motion:reduce){.lunge,.flash img,.flash{animation:none}}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i,.xpbar i,.hp i{transition:none}}
.field{display:flex;flex-direction:column;gap:4px;text-align:left}
.field input{border:2px solid var(--rule);background:var(--chip);border-radius:12px;padding:10px 12px;width:100%}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabrow{display:flex;justify-content:center}

  A.innerHTML=win?`<div class="glyph">🏆</div><div class="big">${f.n}を たおした!</div>${bd}${after.lv>before.lv?`<div class="lvup">レベルアップ! Lv.${after.lv}</div>`:""}<div><b>${coinSVG} +${prize}コイン</b> <span class="muted">(いま ${after.coins}コイン)</span></div>${prac?`<div class="lvup" style="font-size:1.1rem">しゅぎょうパワー +1! <span style="font-size:.85rem">(いま +${st.train})</span></div>`:""}${boss?`<div class="lvup" style="font-size:1.1rem">${TICKET} チケット ${BOSS_TIX}まい ゲット!</div>`:""}${lucky?`<div class="lvup" style="font-size:1.1rem">ラッキー! ${TICKET} チケットが もどってきた!</div>`:""}<div class="row" style="justify-content:center"><button class="ghost" type="button" data-close="gear">そうびを かう</button></div><button class="primary" type="button" data-close="battle">やったー!</button>`
    :`<div class="glyph">${f.e}</div><div class="big">あと ${hp}! にげられた…</div><div><b>${coinSVG} +${prize}コイン</b></div><p class="muted">${boss?"きろくを ふやすと ボスへの こうげきが つよくなるよ。もういちど ちょうせん しよう!":`きろくして つよくなって、もういちど ちょうせん しよう! ${WK[f.w][2]}を そだてると よく きくよ。`}</p><button class="primary" type="button" data-close="battle">つぎは かつ!</button>`;
}

/* ---------- events ---------- */
// Backup: the whole saved state goes into one JSON file (shared to Files on a phone, downloaded elsewhere) and can be read back on any device.
let bkPending=null;
function exportData(){
  st.lastBackup=today(); save();
  const name=`power-note-${today()}.json`, txt=JSON.stringify({app:"power-note",v:1,at:new Date().toISOString(),data:st}), blob=new Blob([txt],{type:"application/json"});
  const dl=()=>{const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);};
  let file=null; try{file=new File([blob],name,{type:"application/json"});}catch(err){}
  if(file&&matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:name}).catch(err=>{if(err&&err.name!=="AbortError")dl();});
  else dl();
  const p=document.querySelector(".bk .muted"); if(p)p.textContent=p.textContent.replace(/(さいごの かきだし: .*|まだ かきだして いません。)$/,`さいごの かきだし: ${st.lastBackup.replace(/-/g,"/")}`);
}
function importData(f){
  if(!f)return; const r=new FileReader();
  r.onload=()=>{let d=null; try{const o=JSON.parse(r.result); d=o&&o.data&&typeof o.data==="object"?o.data:o;}catch(err){}
    if(!d||typeof d!=="object"||!d.days||typeof d.days!=="object"){sheet(`<div class="big">よみこめませんでした</div><p class="muted">パワーノートで かきだした ファイルを えらんで ください。</p><button class="primary" type="button" data-close="">とじる</button>`); return;}
    bkPending=d; const n=Object.keys(d.days).filter(k=>(d.days[k]||[]).length).length, last=Object.keys(d.days).sort().pop()||"-";
    sheet(`<div class="big">この データに もどしますか?</div><p>きろくした ひ: <b>${n}にち</b><br>さいごの きろく: <b>${esc(String(last)).replace(/-/g,"/")}</b><br>たおした モンスター: <b>${+d.stage||0}ひき</b></p><p class="muted">いまの この たんまつの データは、この ファイルの なかみに おきかわります。</p><button class="primary" type="button" id="bkApply">この データで もどす</button><button class="ghost" type="button" data-close="">やめる</button>`);};
  r.readAsText(f);
}
document.addEventListener("change",e=>{if(e.target&&e.target.id==="bkFile"){importData(e.target.files[0]); e.target.value="";}});
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(fighting)return;
  if(t.dataset.tab)return go(t.dataset.tab);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.act){const id=t.dataset.act; if(picked.has(id))picked.delete(id);else picked.add(id); const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.equip){const i=+t.dataset.equip, x=GEAR[i]; if(!x||!owned(i))return; st.equip=Object.assign({},st.equip,{[x.k]:(st.equip||{})[x.k]===i?null:i}); save(); const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.buy){const i=+t.dataset.buy, x=GEAR[i], g=calc(); if(!x||owned(i)||g.coins<priceOf(i))return; st.bought.push(i); st.equip=Object.assign({},st.equip,{[x.k]:i}); save(); render();
    const bd=earnBadges(); render(); sheet(`<div class="big">「${x.n}」を かった!</div>${bd}<div style="max-width:150px;margin:0 auto;width:100%">${heroSVG(g.lv)}</div><ul class="unl"><li class="got"><span>${x.n}</span><span>${gearUp(x)}</span></li></ul><button class="primary" type="button" data-close="">そうび した!</button>`); return;}
  if(t.dataset.mood){if(!MOOD[t.dataset.mood])return; st.moods[today()]=t.dataset.mood; moodAgain=false; if(st.calm[today()]&&!HARD.includes(t.dataset.mood))delete st.calm[today()]; save(); const bd=earnBadges(), y=window.scrollY; render(); window.scrollTo(0,y);
    if(HARD.includes(t.dataset.mood)){delete st.calm[today()]; save(); render(); window.scrollTo(0,y); return openCalm();}
    if(bd)sheet(`${bd}<button class="primary" type="button" data-close="">やったー!</button>`); return;}
  if(t.id==="moodAgain"){moodAgain=true; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.id==="calmOpen")return openCalm();
  if(t.dataset.calm){const c=CALM.find(x=>x[0]===t.dataset.calm); if(!c)return; st.calm[today()]=c[0]; save(); render();
    return sheet(`<div class="glyph">${c[1]}</div><div class="big">${c[2]}</div><p>やって みてね。おちついたら、おうちの ひとに きもちを おはなし しよう。</p><p class="muted">どんな きもちに なっても だいじょうぶ。</p><button class="primary" type="button" data-close="">やってみる</button>`);}
  if(t.id==="peaceOpen")return openPeace(1);
  if(t.dataset.pk){const [st1,ix]=t.dataset.pk.split(":").map(Number); pk[st1]=ix; return openPeace(st1+1);}
  if(t.id==="peaceAdult")return openStamp("","peace");
  if(t.id==="talkDone"){st.talk[today()]=1; save(); const bd=earnBadges(), y=window.scrollY; render(); window.scrollTo(0,y); if(bd)sheet(`${bd}<button class="primary" type="button" data-close="">やったー!</button>`); return;}
  if(t.dataset.coop!=null){const c=coopNow(), i=+t.dataset.coop; if(c.id!=null||!c.opts.includes(i))return; c.id=i; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.id==="coopDone"){const c=coopNow(); if(c.id==null||c.done)return; c.done=true; st.coopN=(st.coopN||0)+1; save(); const bd=earnBadges(); render();
    return sheet(`<div class="glyph">${COOP[c.id][0]}</div><div class="big">ふたりで できた!</div><p>きょうりょく できたね。こころ +2 からだ +1</p>${bd}<button class="primary" type="button" data-close="">やったー!</button>`);}
  if(t.id==="realDone"){const k=today(), n=+st.real.done[k]||0; if(n>=REAL_MAX)return; const txt=realNow(); if(st.real.q[0]===txt)st.real.q.shift(); st.real.done[k]=n+1; save(); const bd=earnBadges(); render();
    return sheet(`<div class="glyph">🏡</div><div class="big">やって みたね!</div><p>${esc(txt)}</p><p>ほんものを つかうと よく わかるね。あたま +2</p>${bd}<button class="primary" type="button" data-close="">やったー!</button>`);}
  if(t.id==="customAdd"){const v=(($("#customIn")||{}).value||"").trim().slice(0,40); if(v&&!st.real.custom.includes(v)){st.real.custom.push(v); save();} return openParent();}
  if(t.dataset.cdel!=null){st.real.custom.splice(+t.dataset.cdel,1); save(); return openParent();}
  if(t.dataset.mis){const m=mission(), id=t.dataset.mis; if(m.id||!ACT[id]||!m.opts.includes(id))return; m.id=id;
    if(doneToday().includes(id)){m.done=true; st.won=(st.won||0)+MISSION_COIN; st.mcount=(st.mcount||0)+1;} save(); const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.id==="parentOpen")return openParent();
  if(t.id==="stampOpen")return openStamp("","stamp");
  if(t.id==="stampCheck"){if(+($("#stampIn").value||"").trim()!==stampAns)return openStamp("こたえが ちがいます。もういちど どうぞ。");
    if(stampMode==="peace"){stampMode="stamp"; const k=today(); st.peace[k]=(+st.peace[k]||0)+1; save(); const bd=earnBadges(); render();
      return sheet(`<div class="glyph">🤝</div><div class="big">なかなおり できたね!</div><p>きもちを はなして、いっしょに きめられたね。<br>${PK_DO[pk[4]]?PK_DO[pk[4]][1]+" が できたね。":""}</p><p><b style="color:var(--heart)">こころ +2</b></p>${bd}<button class="primary" type="button" data-close="">やったー!</button>`);}
    pickStamp(); return;}
  if(t.dataset.stamp){const k=today(); if(!doneToday().length||st.stamps[k])return closeOv(); st.stamps[k]=t.dataset.stamp; save(); render(); const g=calc();
    const bd=earnBadges(); render(); sheet(`<div class="glyph">${esc(st.stamps[k])}</div><div class="big">スタンプを もらった!</div>${bd}<div><b>${coinSVG} +${STAMP_COIN}コイン</b> <span class="muted">(いま ${g.coins}コイン)</span></div><button class="primary" type="button" data-close="">やったー!</button>`); return;}
  if(t.dataset.slot){recSlot=t.dataset.slot; recMore=false; render(); return;}
  if(t.id==="recMore"){recMore=!recMore; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.id==="saveRec")return saveRecord();
  if(t.id==="fight")return battle();
  if(t.id==="bossfight")return battle(true);
  if(t.id==="choose"){const lo=Math.max(0,st.stage-FOES.length*LAPS.length), L=[]; for(let i=st.stage;i>=lo;i--)L.push(i);
    sheet(`<div class="big">あいてを えらぶ</div><p class="muted">きいろが つぎの あいて。ほかは れんしゅう (かつと しゅぎょうパワー +1)。</p><div class="pickg">${L.map(i=>{const x=foeOf(i);return `<button type="button" class="${i===st.stage?"nx":""}" data-pick="${i}" aria-label="${x.n}">${x.e}<small>${i===st.stage?"つぎ":"れんしゅう"} ・ ${x.hp}</small></button>`;}).join("")}</div><button class="ghost" type="button" data-close="">やめる</button>`); return;}
  if(t.dataset.pick!=null){const i=+t.dataset.pick; foePick=i<st.stage?i:null; closeOv(); render(); window.scrollTo(0,0); return;}
  if(t.id==="gearBtn")return openSettings();
  if(t.dataset.close!==undefined){closeOv(); if(t.dataset.close)go(t.dataset.close); return;}
  if(t.dataset.look){const kv=t.dataset.look.split(":"), k=kv[0], v=+kv[1]; if(!["hair","style","skin","shirt","eyes","mouth","cheek"].includes(k))return;
    const L=look(); L[k]=v<0?null:v; st.look=L; const ni=$("#nameIn"); if(ni)st.name=(ni.value||"").trim().slice(0,12); save();
    const sh=document.querySelector(".sheet"), y=sh?sh.scrollTop:0; render(); openSettings(); const s2=document.querySelector(".sheet"); if(s2)s2.scrollTop=y; return;}
  if(t.id==="setOk"){st.name=($("#nameIn").value||"").trim().slice(0,12); save(); closeOv(); return render();}
  if(t.id==="bkOut")return exportData();
  if(t.id==="bkIn"){$("#bkFile").click(); return;}
  if(t.id==="bkApply"&&bkPending){try{localStorage.setItem(LS,JSON.stringify(bkPending));}catch(err){} location.reload(); return;}
  if(t.id==="undoToday"){if(t.dataset.sure){delete st.days[today()]; delete st.stamps[today()]; delete st.moods[today()]; delete st.calm[today()]; delete st.talk[today()]; save(); closeOv(); render();}else{t.dataset.sure="1";t.textContent="もういちど おすと きょうの ぶんを けします";} return;}
  if(t.id==="resetAll"){if(t.dataset.sure){st={name:st.name,look:st.look,days:{},used:0,stage:0,bonus:0,equip:{},won:0,bought:[],stamps:{},mission:null,moods:{},badges:[],miss:{},mcount:0,calm:{},peace:{},talk:{},coop:null,coopN:0,real:{q:[],done:{},custom:(st.real&&st.real.custom)||[]},skill:{},gifts:0}; save(); closeOv(); render();}else{t.dataset.sure="1";t.textContent="もういちど おすと ぜんぶ きえます";} return;}
});
render();
{const t=today(), ks=Object.keys(st.days).filter(k=>k<t&&(st.days[k]||[]).some(id=>ACT[id])).sort(), last=ks[ks.length-1];
  if(last&&!(st.days[t]||[]).length&&st.hello!==t&&(new Date(t+"T12:00:00")-new Date(last+"T12:00:00"))/864e5>=3){st.hello=t; save();
    sheet(`<div style="max-width:150px;margin:0 auto;width:100%">${heroSVG(calc().lv)}</div><div class="big">おかえり! まってたよ</div><p>また いっしょに がんばろう!</p><button class="primary" type="button" data-close="">ただいま!</button>`);}}
})();
